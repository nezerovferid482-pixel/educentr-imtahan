<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educentr Təhsil Mərkəzi İmtahan Nəticəsi</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, #e0f7fa, #f0f4c3);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            background-color: #0078D7;
            color: white;
            width: 100%;
            padding: 30px 0;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            margin-bottom: 40px;
        }

        header h1 { margin: 0; font-size: 2.2em; }
        header p { font-size: 1.1em; margin-top: 10px; }

        input {
            padding: 12px;
            font-size: 16px;
            width: 250px;
            margin-right: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
            background-color: #00bcd4;
            color: white;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.3s;
        }

        button:hover {
            background-color: #0097a7;
            transform: scale(1.05);
        }

        #result {
            margin-top: 30px;
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            text-align: center;
        }

        #result h3 { color: #0078D7; margin-bottom: 15px; }
        #result p { font-size: 1.1em; margin: 5px 0; }

        footer {
            margin-top: 50px;
            width: 100%;
            text-align: center;
            padding: 20px 0;
            background-color: #0078D7;
            color: white;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Educentr Təhsil Mərkəzi</h1>
        <p>İmtahan Nəticəsi</p>
    </header>

    <div>
        <input type="text" id="studentId" placeholder="Şagird Kodunu yaz">
        <button onclick="showResult()">Nəticəni göstər</button>
    </div>

    <div id="result"></div>

    <footer>
        &copy; 2025 Educentr Təhsil Mərkəzi
    </footer>

    <script>
        // 🔹 Excel faylının linki (standart download?resid= formatında)
        const excelUrl = "https://1drv.ms/x/s!Ef9Gm2i-4rdLjWeoEJYtjpIBYRZTklY?download?resid=Ef9Gm2i-4rdLjWeoEJYtjpIBYRZTklYux7wUIh2QxOTOWQ";

        let studentData = [];

        async function loadExcel() {
            try {
                const response = await fetch(excelUrl);
                const arrayBuffer = await response.arrayBuffer();
                const workbook = XLSX.read(arrayBuffer, { type: "array" });
                const sheetName = workbook.SheetNames[0];
                studentData = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName]);
            } catch (err) {
                document.getElementById("result").innerHTML = "<p style='color:red;'>Excel faylı yüklənmədi. Linki və formatı yoxlayın.</p>";
            }
        }

        function showResult() {
            const id = document.getElementById("studentId").value.trim();
            const student = studentData.find(s => String(s['ŞagirdID']) === id);
            const resultDiv = document.getElementById("result");

            if(student){
                resultDiv.innerHTML = `
                    <h3>${student.AdSoyad} - Nəticə</h3>
                    <p>İmtahan Tarixi: ${student.İmtahanTarixi}</p>
                    <p>Saat: ${student.Saat}</p>
                    <p>Qiymət: <strong>${student.Nəticə}</strong></p>
                `;
            } else {
                resultDiv.innerHTML = <p style="color:red;">Şagird tapılmadı. Kodun düzgün daxil edin.</p>;
            }
        }

        // Excel faylını dərhal yüklə
        loadExcel();
    </script>

</body>
</html>
